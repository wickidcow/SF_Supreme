name: Apply GenericMachine concurrency hardening

on:
  push:
    branches:
      - fix/supreme-generic-state-concurrency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supreme-generic-state-concurrency
          fetch-depth: 0

      - name: Harden GenericMachine live state
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main/java/com/github/relativobr/supreme/generic/machine/GenericMachine.java')
          text = path.read_text(encoding='utf-8')

          import_marker = 'import java.util.Set;\n'
          if 'import java.util.concurrent.ConcurrentHashMap;' not in text:
              if import_marker not in text:
                  raise SystemExit('ConcurrentHashMap import marker not found')
              text = text.replace(import_marker, import_marker + 'import java.util.concurrent.ConcurrentHashMap;\n', 1)

          replacements = {
              'private final Map<Block, MachineRecipe> processing = new HashMap<>();':
                  'private final Map<Block, MachineRecipe> processing = new ConcurrentHashMap<>();',
              'private final Map<Block, Integer> progressTime = new HashMap<>();':
                  'private final Map<Block, Integer> progressTime = new ConcurrentHashMap<>();',
              'private final Map<Block, Map<ItemStack, Integer>> consumedItemsMap = new HashMap<>();':
                  'private final Map<Block, Map<ItemStack, Integer>> consumedItemsMap = new ConcurrentHashMap<>();',
              'private final Map<Block, Integer> attemptCount = new HashMap<>();':
                  'private final Map<Block, Integer> attemptCount = new ConcurrentHashMap<>();',
              'private final Map<Block, Long> heavyCheckAfter = new HashMap<>();':
                  'private final Map<Block, Long> heavyCheckAfter = new ConcurrentHashMap<>();',
              'private final Map<Block, Integer> lastProgressCheckpoint = new HashMap<>();':
                  'private final Map<Block, Integer> lastProgressCheckpoint = new ConcurrentHashMap<>();',
              'private final Map<Block, Map<ItemStack, Integer>> activeRequiredItems = new HashMap<>();':
                  'private final Map<Block, Map<ItemStack, Integer>> activeRequiredItems = new ConcurrentHashMap<>();',
              'return consumedItemsMap.computeIfAbsent(b, ignored -> new LinkedHashMap<>());':
                  'return consumedItemsMap.computeIfAbsent(b, ignored -> new ConcurrentHashMap<>());',
              'consumedItemsMap.put(b, new LinkedHashMap<>());':
                  'consumedItemsMap.put(b, new ConcurrentHashMap<>());',
              'consumedItemsMap.put(b, new LinkedHashMap<>(state.consumedItems()));':
                  'consumedItemsMap.put(b, new ConcurrentHashMap<>(state.consumedItems()));',
          }

          for old, new in replacements.items():
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected source marker not found: {old}')
              text = text.replace(old, new, 1)

          comment_marker = '  private final Map<Block, MachineRecipe> processing = new ConcurrentHashMap<>();\n'
          comment = (
              '  // AContainer ticks asynchronously on Paper/Purpur, while transport and block-break paths may\n'
              '  // inspect or clear the same placed-machine state from another server-owned thread.\n'
          )
          if comment not in text:
              text = text.replace(comment_marker, comment + comment_marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit transformed source
        shell: bash
        run: |
          if git diff --quiet -- src/main/java/com/github/relativobr/supreme/generic/machine/GenericMachine.java; then
            echo 'No GenericMachine changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/github/relativobr/supreme/generic/machine/GenericMachine.java
          git commit -m 'Harden GenericMachine runtime state concurrency'
          git push origin HEAD:fix/supreme-generic-state-concurrency
