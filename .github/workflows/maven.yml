name: Build Supreme Legacy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supreme Legacy
        uses: actions/checkout@v5

      - name: Checkout Slimefun Legacy API
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          path: slimefun-legacy

      - name: Verify legacy Config API isolation
        shell: bash
        run: |
          set -euo pipefail

          LEGACY_CONFIG_USERS="$(
            grep -RIl --include='*.java' \
              'me.mrCookieSlime.CSCoreLibPlugin.Configuration.Config' \
              src/main/java | grep -v '/compat/' || true
          )"

          if [[ -n "$LEGACY_CONFIG_USERS" ]]; then
            echo "Legacy Config API escaped the compatibility package:" >&2
            echo "$LEGACY_CONFIG_USERS" >&2
            exit 1
          fi

          if grep -RIn --include='*.java' 'new BlockTicker' src/main/java; then
            echo "Direct BlockTicker implementations must use SupremeBlockTicker." >&2
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Publish Slimefun Legacy API locally
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -PprojectVersion=Legacy-SNAPSHOT

      - name: Build Supreme against Slimefun Legacy
        run: mvn -B -Plegacy clean verify

      - name: Upload Supreme jar
        uses: actions/upload-artifact@v4
        with:
          name: Supreme-Legacy
          path: target/Supreme-Legacy.jar
          if-no-files-found: error

  compatibility-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [gugu]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile against ${{ matrix.profile }} API
        run: mvn -B -P${{ matrix.profile }} -DskipTests clean package

  compatibility-united:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supreme Legacy
        uses: actions/checkout@v5

      - name: Checkout Slimefun United API
        uses: actions/checkout@v5
        with:
          repository: Slimefun-United/Slimefun-United
          ref: dev
          path: slimefun-united

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Slimefun United API jar
        working-directory: slimefun-united
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests -Dmaven.javadoc.skip=true clean package

      - name: Install United jar under isolated CI coordinate
        shell: bash
        run: |
          set -euo pipefail

          UNITED_JAR="$(find "$GITHUB_WORKSPACE/slimefun-united/target" \
            -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*' \
            -print -quit)"

          if [[ -z "$UNITED_JAR" || ! -f "$UNITED_JAR" ]]; then
            echo "No compiled Slimefun United jar was found." >&2
            find "$GITHUB_WORKSPACE/slimefun-united/target" -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "Installing United API from: $UNITED_JAR"
          cd "$RUNNER_TEMP"
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$UNITED_JAR" \
            -DgroupId=io.github.slimefun_united \
            -DartifactId=slimefun-united \
            -Dversion=4.10-CI \
            -Dpackaging=jar \
            -DgeneratePom=true

          test -f "$HOME/.m2/repository/io/github/slimefun_united/slimefun-united/4.10-CI/slimefun-united-4.10-CI.jar"
          test -f "$HOME/.m2/repository/io/github/slimefun_united/slimefun-united/4.10-CI/slimefun-united-4.10-CI.pom"

      - name: Compile Supreme against Slimefun United
        run: mvn -B -Punited -Dslimefun.version=4.10-CI -DskipTests clean package
