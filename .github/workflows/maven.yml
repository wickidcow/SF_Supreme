name: Build Supreme Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "1.0.11"
  OUTPUT_NAME: "SF_Supreme1.0.11.jar"

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supreme Legacy
        uses: actions/checkout@v5

      - name: Verify Supreme safety invariants
        shell: bash
        run: bash scripts/verify-supreme-invariants.sh .

      - name: Checkout Slimefun Legacy API
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          path: slimefun-legacy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify release metadata alignment
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$PROJECT_VERSION" = "$LEGACY_ARTIFACT_VERSION"
          test "$OUTPUT_NAME" = "SF_Supreme${PROJECT_VERSION}.jar"

      - name: Publish Slimefun Legacy API locally
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -PprojectVersion=Legacy-SNAPSHOT

      - name: Build Supreme against Slimefun Legacy
        run: mvn -B -Plegacy clean verify

      - name: Stage versioned JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/Supreme-Legacy.jar "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

      - name: Publish immutable raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          NOTES="Supreme Legacy 1.0.11 hardens GenericMachine live runtime state for Slimefun's asynchronous AContainer ticker. Per-block processing, progress, staged-input, retry, backoff, checkpoint, and active-requirement maps now use concurrency-safe storage where they can be observed by machine ticks, transport, diagnostics, or block-break recovery from different server execution paths. Mutable reserved-input maps are also concurrency-safe. Machine processing remains asynchronous; no main-thread scheduler hop or coarse inventory lock was added. Recipes, item IDs, output quantities, processing speeds, energy costs, persistence format, rollback rules, staged Networks/Cargo behavior, and progression are unchanged. CI continues to compile against Paper 26.2, Paper 26.3, rolling-latest Paper, Slimefun Legacy, Gugu, and United."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its tag and asset unchanged."
            exit 0
          fi
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "SF_Supreme $TAG" --notes "$NOTES"

  compatibility-paper:
    name: compatibility-paper (${{ matrix.api-line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-line: "26.2"
            paper-version: "[26.2.build,26.3.build)"
          - api-line: "26.3"
            paper-version: "[26.3.build,26.4.build)"
          - api-line: "rolling-latest"
            paper-version: "[26.3.build,)"
    steps:
      - name: Checkout Supreme Legacy
        uses: actions/checkout@v5
      - name: Checkout Slimefun Legacy API
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Publish Slimefun Legacy API locally
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -PprojectVersion=Legacy-SNAPSHOT
      - name: Compile Supreme against Paper API line
        env:
          PAPER_VERSION: ${{ matrix.paper-version }}
        run: mvn -B -Plegacy -Dpaper.version="$PAPER_VERSION" -DskipTests clean package

  compatibility-gugu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile against Gugu API
        run: mvn -B -Pgugu -DskipTests clean package

  compatibility-united:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supreme Legacy
        uses: actions/checkout@v5
      - name: Checkout Slimefun United API
        uses: actions/checkout@v5
        with:
          repository: Slimefun-United/Slimefun-United
          ref: dev
          path: slimefun-united
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Slimefun United API jar
        working-directory: slimefun-united
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests -Dmaven.javadoc.skip=true clean package
      - name: Install United jar for CI
        shell: bash
        run: |
          set -euo pipefail
          UNITED_JAR="$(find "$GITHUB_WORKSPACE/slimefun-united/target" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*' -print -quit)"
          test -n "$UNITED_JAR"
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$UNITED_JAR" -DgroupId=io.github.slimefun_united -DartifactId=slimefun-united -Dversion=4.10-CI -Dpackaging=jar -DgeneratePom=true
      - name: Compile Supreme against Slimefun United
        run: mvn -B -Punited -Dslimefun.version=4.10-CI -DskipTests clean package
