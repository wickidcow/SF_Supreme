name: Build Supreme

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: "1.0.21"
  OUTPUT_NAME: "SF_Supreme1.0.21.jar"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supreme
        uses: actions/checkout@v5
      - name: Verify distinct Supreme 1.0.21 candidate version contract
        run: python3 -m unittest discover -s scripts -p 'test_release_candidate_identity.py' -v
      - name: Test distributable class and package identity guard
        run: python3 -m unittest discover -s scripts -p 'test_verify_java21_distribution.py' -v
      - name: Verify Supreme safety invariants
        shell: bash
        run: bash scripts/verify-supreme-invariants.sh .
      - name: Verify Slimefun Doctor migration invariants
        shell: bash
        run: bash scripts/verify-doctor-migration.sh .
      - name: Checkout Slimefun Legacy API
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash scripts/install_maven_3_10.sh
      - name: Verify canonical release identity
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "$PROJECT_VERSION" = "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          test "$OUTPUT_NAME" = "SF_Supreme${VERSION}.jar"
          grep -Fq '<artifactId>Supreme</artifactId>' pom.xml
          grep -Fq '<name>Supreme</name>' pom.xml
      - name: Publish Slimefun Legacy API locally
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -PprojectVersion=Legacy-SNAPSHOT
      - name: Build Supreme against Slimefun Legacy
        run: mvn -B -Plegacy clean verify
      - name: Verify entire raw Supreme Java 21 distributable
        run: python3 scripts/verify_java21_distribution.py target/SF_Supreme1.0.21.jar 1.0.21
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supreme-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
      - name: Stage canonical JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="target/${OUTPUT_NAME}"
          test -s "$JAR"
          PLUGIN_VERSION=$(unzip -p "$JAR" plugin.yml | awk -F': *' '/^version:/ {gsub(/["'"'"']/,"",$2); print $2; exit}')
          test "$PLUGIN_VERSION" = "$VERSION"
          if printf '%s\n' "$PLUGIN_VERSION" | grep -Eiq '(legacy|english|snapshot)'; then exit 1; fi
          if unzip -Z1 "$JAR" | grep -E '^(org/mockito/|org/junit/|org/mockbukkit/)' >/dev/null; then
            echo "Test dependencies must not be packaged in the release JAR." >&2
            exit 1
          fi
          cp "$JAR" "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload canonical raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error

  compatibility-paper:
    name: compatibility-paper (${{ matrix.api-line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-line: "26.2"
            paper-version: "[26.2.build,26.3.build)"
          - api-line: "26.3"
            paper-version: "[26.3.build,26.4.build)"
          - api-line: "rolling-latest"
            paper-version: "[26.3.build,)"
    steps:
      - name: Checkout Supreme
        uses: actions/checkout@v5
      - name: Checkout Slimefun Legacy API
        uses: actions/checkout@v5
        with:
          repository: wickidcow/Slimefun-Legacy
          path: slimefun-legacy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash scripts/install_maven_3_10.sh
      - name: Publish Slimefun Legacy API locally
        working-directory: slimefun-legacy
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -x test -PprojectVersion=Legacy-SNAPSHOT
      - name: Compile Supreme against Paper API line
        env:
          PAPER_VERSION: ${{ matrix.paper-version }}
        run: mvn -B -Plegacy -Dpaper.version="$PAPER_VERSION" -DskipTests clean package

  compatibility-gugu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash scripts/install_maven_3_10.sh
      - name: Compile against Gugu API
        run: mvn -B -Pgugu -DskipTests clean package

  compatibility-united:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Supreme
        uses: actions/checkout@v5
      - name: Checkout Slimefun United API
        uses: actions/checkout@v5
        with:
          repository: Slimefun-United/Slimefun-United
          ref: dev
          path: slimefun-united
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install checksum-verified Apache Maven 3.10.0
        run: bash scripts/install_maven_3_10.sh
      - name: Build Slimefun United API jar
        working-directory: slimefun-united
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests -Dmaven.javadoc.skip=true clean package
      - name: Install United jar for CI
        shell: bash
        run: |
          set -euo pipefail
          UNITED_JAR="$(find "$GITHUB_WORKSPACE/slimefun-united/target" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*' -print -quit)"
          test -n "$UNITED_JAR"
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$UNITED_JAR" -DgroupId=io.github.slimefun_united -DartifactId=slimefun-united -Dversion=4.10-CI -Dpackaging=jar -DgeneratePom=true
      - name: Compile Supreme against Slimefun United
        run: mvn -B -Punited -Dslimefun.version=4.10-CI -DskipTests clean package

  release:
    needs: [build, compatibility-paper, compatibility-gugu, compatibility-united]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated canonical JAR
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: dist
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          JAR="dist/${OUTPUT_NAME}"

          if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $TAG." >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Existing versioned releases are immutable." >&2
            exit 1
          fi

          test -s "$JAR"
          gh release create "$TAG" "$JAR"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "SF_Supreme ${VERSION}"             --notes "Supreme ${VERSION}: canonical ${OUTPUT_NAME} release."
